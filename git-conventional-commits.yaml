---
convention:
  commitTypes:
  - feat
  - fix
  - perf
  - refactor
  - style
  - test
  - build
  - ops
  - docs
  - chore
  - merge
  - revert
  commitScopes: []
  releaseTagGlobPattern: v[0-9]*.[0-9]*.[0-9]*
changelog:
  commitTypes:
  - feat
  - fix
  - perf
  - merge
  includeInvalidCommits: true
  commitIgnoreRegexPattern: "^WIP "
  headlines:
    feat: Features
    fix: Bug Fixes
    perf: Performance Improvements
    merge: Merges
    breakingChange: BREAKING CHANGES

  ## Forgejo
  # commitUrl: http://192.168.7.69:3002/TomSegbers/tomsegbers-de/commit/%commit%
  # commitRangeUrl: http://192.168.7.69:3002/TomSegbers/tomsegbers-de/compare/%from%...%to%

  ## Forgejo Issues
  # issueRegexPattern: "#[0-9]+"
  # issueUrl: http://192.168.7.69:3002/TomSegbers/tomsegbers-de/issues/%issue%

  ## Jira Issues
  # issueRegexPattern: "[A-Z][A-Z0-9]+-[0-9]+"
  # issueUrl: https://WORKSPACE.atlassian.net/browse/%issue%

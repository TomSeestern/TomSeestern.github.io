# Forgejo → GitHub main mirror (ADR-0002).
#
# Forgejo remains the source of truth. This workflow runs only on a push to
# main and force-pushes exactly one ref to the GitHub repository so Vercel's
# Git integration can deploy it. It never mirrors feature branches, dev, or
# tags, and GitHub runs no CI for this project.
#
# Authentication is a repository-scoped Ed25519 deploy key: the public half
# is a write deploy key on the GitHub repository and the private half is the
# Forgejo secret MIRROR_SSH_KEY. The host keys are committed at
# docs/security/github-known-hosts and checked strictly.

name: mirror-main

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mirror-main
  cancel-in-progress: true

jobs:
  mirror:
    name: mirror main to GitHub
    runs-on: linux
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure mirror SSH key
        env:
          MIRROR_SSH_KEY: ${{ secrets.MIRROR_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MIRROR_SSH_KEY}" ]; then
            echo "::error::MIRROR_SSH_KEY is empty; register the GitHub deploy key in Forgejo Actions secrets."
            exit 1
          fi
          install -d -m 700 "$RUNNER_TEMP/github-mirror"
          printf '%s\n' "$MIRROR_SSH_KEY" > "$RUNNER_TEMP/github-mirror/id_ed25519"
          chmod 600 "$RUNNER_TEMP/github-mirror/id_ed25519"
          {
            printf 'GIT_SSH_COMMAND=ssh -i %s -o IdentitiesOnly=yes' "$RUNNER_TEMP/github-mirror/id_ed25519"
            printf ' -o UserKnownHostsFile=%s/docs/security/github-known-hosts' "$GITHUB_WORKSPACE"
            printf ' -o StrictHostKeyChecking=yes\n'
          } >> "$GITHUB_ENV"

      - name: Push only main to GitHub
        env:
          GITHUB_MIRROR_REPOSITORY: TomSeestern/TomSeestern.github.io
        run: |
          set -euo pipefail
          git push --force "git@github.com:${GITHUB_MIRROR_REPOSITORY}.git" "HEAD:refs/heads/main"
          remote_sha=$(git ls-remote "git@github.com:${GITHUB_MIRROR_REPOSITORY}.git" refs/heads/main | cut -f1)
          if [ "${remote_sha}" != "$(git rev-parse HEAD)" ]; then
            echo "::error::GitHub main is ${remote_sha}, expected $(git rev-parse HEAD)"
            exit 1
          fi
          echo "Mirrored $(git rev-parse HEAD) to ${GITHUB_MIRROR_REPOSITORY} main"

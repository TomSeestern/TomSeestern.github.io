name: Update Screenshots

on:
  # Manual only. This job used to push a `[skip ci]` commit straight to main,
  # which bypassed the gate and could advance the deploy branch without a
  # mirror check. A dispatch run now produces an ordinary commit that goes
  # through Check like any other (ADR-0003).
  workflow_dispatch:

# One slot per ref: Lighthouse measures total-blocking-time on a shared host, and
# auditing beside Check, Playwright and Bundle Analysis turned a 241 ms median
# into 890 ms on 2026-10-21. Queue instead of race; never cancel a sibling —
# a cancelled run leaves the ref half-verified.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  screenshots:
    name: Update Screenshots
    runs-on: linux
    steps:
      - name: Configure nix (LAN cache)
        run: |
          # access() fails on read-only mounts even for root, unlike -w on dirs.
          if [ -w /etc/nix/nix.conf ]; then
            NIX_CONF=/etc/nix/nix.conf
          else
            NIX_CONF="${HOME:-/root}/.config/nix/nix.conf"
            mkdir -p "$(dirname "$NIX_CONF")"
          fi
          cat > "$NIX_CONF" << 'EOF'
          substituters = http://127.0.0.1:5000 https://cache.nixos.org
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= harmonia-cache:xuOVJHvJ0pZ9znLhigqDtY/V/fzTLrYNvaGCNzyAMkQ=
          EOF
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install dependencies
        run: nix develop -c pnpm install --frozen-lockfile
      - name: Build Next.js app
        run: nix develop -c pnpm build
      - name: Install Playwright Chromium
        run: nix develop -c pnpm exec playwright install chromium
      - name: Generate screenshots
        run: nix develop -c pnpm screenshots:update
      - name: Commit and push updated screenshots
        run: |
          if [ -n "$(git status --porcelain public/img/screenshots/)" ]; then
            git config user.name "Forgejo Actions Bot"
            git config user.email "bot@noreply.local"
            git add public/img/screenshots/
            git commit -m "chore(docs): update feature screenshots"
            git push origin main
          else
            echo "No screenshot changes detected."
          fi

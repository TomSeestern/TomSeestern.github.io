name: Next.js Bundle Analysis

# Migrated from the GitHub workflow (2026-08-09). GitHub-only pieces were
# dropped: base-branch artifact comparison (dawidd6/action-download-artifact)
# and PR comment posting (actions/github-script, peter-evans/*) — Forgejo has
# no equivalent PR-comment API. Remaining: build + analyze + artifact upload.
# Cross-run comparison can be done locally against the uploaded artifacts.

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

defaults:
  run:
    # change this if your nextjs app does not live at the root of the repo
    working-directory: ./

jobs:
  analyze:
    env:
      SKIP_ENV_VALIDATION: true
    runs-on: linux
    steps:
      - name: Configure nix (LAN cache)
        run: |
          # access() fails on read-only mounts even for root, unlike -w on dirs.
          if [ -w /etc/nix/nix.conf ]; then
            NIX_CONF=/etc/nix/nix.conf
          else
            NIX_CONF="${HOME:-/root}/.config/nix/nix.conf"
            mkdir -p "$(dirname "$NIX_CONF")"
          fi
          cat > "$NIX_CONF" << 'EOF'
          substituters = http://127.0.0.1:5000 https://cache.nixos.org
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= harmonia-cache:xuOVJHvJ0pZ9znLhigqDtY/V/fzTLrYNvaGCNzyAMkQ=
          EOF
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install dependencies
        run: nix develop -c pnpm install --frozen-lockfile
      - name: Build next.js app
        env:
          SKIP_BUILD_PRODUCT_REDIRECTS: 1
        # change this if your site requires a custom build command
        run: nix develop -c pnpm build
      - name: Analyze bundle
        run: nix develop -c node report-bundle-size.js
      - name: Check bundle budget
        run: nix develop -c node scripts/check-bundle-budget.mjs
      - name: Upload bundle
        # v3, not v4: the v4 artifact client refuses Forgejo (GHES-style) servers.
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf # v3.2.2
        with:
          name: bundle
          path: .next/analyze/__bundle_analysis.json

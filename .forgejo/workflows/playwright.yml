name: Playwright Tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: linux
    steps:
      - name: Configure nix (LAN cache)
        run: |
          # access() fails on read-only mounts even for root, unlike -w on dirs.
          if [ -w /etc/nix/nix.conf ]; then
            NIX_CONF=/etc/nix/nix.conf
          else
            NIX_CONF="${HOME:-/root}/.config/nix/nix.conf"
            mkdir -p "$(dirname "$NIX_CONF")"
          fi
          cat > "$NIX_CONF" << 'EOF'
          substituters = http://127.0.0.1:5000 https://cache.nixos.org
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= harmonia-cache:xuOVJHvJ0pZ9znLhigqDtY/V/fzTLrYNvaGCNzyAMkQ=
          EOF
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install dependencies
        run: nix develop -c pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        # Chromium only — the e2e suite runs with --project=chromium; the
        # devShell (flake.nix) provides the system libraries via LD_LIBRARY_PATH.
        run: nix develop -c pnpm exec playwright install chromium
      - name: Run Playwright tests
        run: nix develop -c pnpm exec playwright test --project=chromium
      - uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf # v3.2.2
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

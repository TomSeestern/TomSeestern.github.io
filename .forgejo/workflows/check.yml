name: Check

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

# One slot per ref: Lighthouse measures total-blocking-time on a shared host, and
# auditing beside Check, Playwright and Bundle Analysis turned a 241 ms median
# into 890 ms on 2026-10-21. Queue instead of race; never cancel a sibling —
# a cancelled run leaves the ref half-verified.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: linux
    timeout-minutes: 35
    steps:
      - name: Configure nix (LAN cache)
        run: |
          # access() fails on read-only mounts even for root, unlike -w on dirs.
          if [ -w /etc/nix/nix.conf ]; then
            NIX_CONF=/etc/nix/nix.conf
          else
            NIX_CONF="${HOME:-/root}/.config/nix/nix.conf"
            mkdir -p "$(dirname "$NIX_CONF")"
          fi
          cat > "$NIX_CONF" << 'EOF'
          substituters = http://127.0.0.1:5000 https://cache.nixos.org
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= harmonia-cache:xuOVJHvJ0pZ9znLhigqDtY/V/fzTLrYNvaGCNzyAMkQ=
          EOF
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install dependencies
        run: nix develop -c pnpm install --frozen-lockfile
      - name: Dependency audit
        # Accepted advisories are documented in docs/security/audit-exceptions.md.
        run: |
          nix develop -c pnpm audit --prod --audit-level=high \
            --ignore GHSA-mrhx-c7xc-m3w5 \
            --ignore GHSA-6g55-p6wh-862q \
            --ignore GHSA-r28c-9q8g-f849
      - name: Typecheck
        run: nix develop -c pnpm typecheck
      - name: Build
        run: nix develop -c pnpm build
      - name: Lint check
        run: nix develop -c pnpm lint
      - name: Format check
        run: nix develop -c pnpm prettier
      - name: Content slop audit
        run: nix develop -c pnpm content:audit
      - name: Contrast gate
        run: nix develop -c pnpm contrast
      - name: Design token gate
        run: nix develop -c pnpm design-tokens
      - name: Image size gate
        run: nix develop -c pnpm images
      - name: Font budget gate
        run: nix develop -c pnpm fonts
      - name: Unit & Integration tests
        run: nix develop -c pnpm test
      - name: End-to-end tests (production build)
        run: |
          nix develop -c pnpm exec playwright install chromium
          nix develop -c pnpm exec playwright test --project=chromium
      - name: Smoke & Acceptance tests
        run: |
          nix develop -c pnpm build-storybook --quiet
          nix develop -c pnpm exec playwright install chromium
          nix develop -c npx concurrently -k -s first -n "SB,TEST" -c "magenta,blue" \
            "npx http-server storybook-static --port 6006 --silent" \
            "npx wait-on tcp:127.0.0.1:6006 && pnpm test-storybook"
      # Deploy is the last step of this job, not a sibling workflow: production
      # may only receive a commit that passed every gate above. If this step is
      # reached with any failure, `success()` is false and the mirror is skipped.
      - name: Mirror main to GitHub
        if: github.ref == 'refs/heads/main' && success()
        env:
          MIRROR_SSH_KEY: ${{ secrets.MIRROR_SSH_KEY }}
          GITHUB_MIRROR_REPOSITORY: TomSeestern/TomSeestern.github.io
        run: |
          set -euo pipefail
          if [ -z "${MIRROR_SSH_KEY}" ]; then
            echo "::error::MIRROR_SSH_KEY is empty; register the GitHub deploy key in Forgejo Actions secrets."
            exit 1
          fi
          install -d -m 700 "$RUNNER_TEMP/github-mirror"
          printf '%s\n' "$MIRROR_SSH_KEY" > "$RUNNER_TEMP/github-mirror/id_ed25519"
          chmod 600 "$RUNNER_TEMP/github-mirror/id_ed25519"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/github-mirror/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=$GITHUB_WORKSPACE/docs/security/github-known-hosts -o StrictHostKeyChecking=yes"

          # The shared checkout is shallow (depth 1). Pushing from it sends the
          # tip commit without its parent, and GitHub rejects the pack with
          # "remote: fatal: did not receive expected object <parent>". Deepen
          # only here, so the common no-deploy run stays a fast shallow clone.
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --unshallow origin
          fi

          # Never move GitHub backwards: with cancel-in-progress false, an older
          # run can finish after a newer one. Only the current tip may deploy.
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "${tip}" != "$(git rev-parse HEAD)" ]; then
            echo "Not the tip of main (${tip}); skipping mirror."
            exit 0
          fi

          git push --force "git@github.com:${GITHUB_MIRROR_REPOSITORY}.git" "HEAD:refs/heads/main"
          remote_sha=$(git ls-remote "git@github.com:${GITHUB_MIRROR_REPOSITORY}.git" refs/heads/main | cut -f1)
          if [ "${remote_sha}" != "$(git rev-parse HEAD)" ]; then
            echo "::error::GitHub main is ${remote_sha}, expected $(git rev-parse HEAD)"
            exit 1
          fi
          echo "Mirrored $(git rev-parse HEAD) to ${GITHUB_MIRROR_REPOSITORY} main"
